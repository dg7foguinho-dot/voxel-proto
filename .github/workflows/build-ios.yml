name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3-stable
  IOS_PRESET: iOS
  NAME: ${{ github.event.repository.name }}

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot headless & templates
        run: |
          # Baixa o executável do Godot
          curl -L "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" -o godot.zip
          unzip -q godot.zip -d godot
          
          # Baixa os templates de exportação (o .tpz é um zip)
          curl -L "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q templates.tpz -d temp_templates
          
          # Move os templates pro lugar certo
          mv temp_templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/"
          mv "$HOME/Library/Application Support/Godot/export_templates/version.txt" "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/"
          
          # O Godot procura a pasta com o nome da versão exata
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mv "$HOME/Library/Application Support/Godot/export_templates/"* "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/" 2>/dev/null || true

      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project build/ios/${NAME}.xcodeproj \
            -scheme "${NAME}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${NAME}.ipa" Payload
          mv "${NAME}.ipa" ../../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ env.NAME }}.ipa
          retention-days: 14
